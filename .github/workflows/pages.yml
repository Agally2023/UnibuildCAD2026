name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Build web
        run: |
          npx expo export --platform web
          cp dist/index.html dist/404.html   # single-page app: unknown paths load the app
          touch dist/.nojekyll
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # The project URL and anon key are public by design (data is protected by row-level security), so they are the defaults here.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://rciyzoosuncncecqmqaq.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjaXl6b29zdW5jbmNlY3FtcWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDg5NjUsImV4cCI6MjEwODc4NDk2NX0.9eFRqMV6e93D0_FpdXY2ES8J5iP_FGwXAtgysbOXlrw' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
